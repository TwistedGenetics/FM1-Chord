# SPDX-License-Identifier: GPL-3.0-only
# FM1-Chord for iPad: the Xcode project, made by XcodeGen (brew install xcodegen; cd ios; xcodegen).
# The app carries the repo's web/ folder as it is, so it's always the editor of the same commit.
name: FM1ChordEditor
options:
  bundleIdPrefix: com.twistedgenetics
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1"   # (CI sets it from VERSION)
    CURRENT_PROJECT_VERSION: "1"
targets:
  FM1ChordEditor:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/bridge.js
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: ../web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: FM1Chord
        PRODUCT_BUNDLE_IDENTIFIER: com.twistedgenetics.fm1chord.editor
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: FM1-Chord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        # the app's folder in Files (On My iPad > FM1-Chord): downloads and the chord sets folder
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # so the pages' file pickers can choose these (Files greys out a type it doesn't know)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.twistedgenetics.fm1chord.chordset
            UTTypeDescription: FM1-Chord chord set
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [chordset]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.twistedgenetics.fm1chord.mid
            UTTypeDescription: Standard MIDI file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mid]
          - UTTypeIdentifier: com.twistedgenetics.fm1chord.fwsc
            UTTypeDescription: FM-1 firmware package
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fwsc]
