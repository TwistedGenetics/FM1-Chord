<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<!-- FM1-Chord for Ableton Live: the device's own strip (in Max's web view, 660 x 169). The set, the chord playing
     and the 27 keys; EDITOR opens the full editor in its own window. Talks to the device (fm1chord.js) through
     window.max; the device calls window.__fcIn(name, data). Copyright (C) 2026 Jamie (TwistedGenetics). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>FM1-Chord</title>
<style>
  :root { --bg: #1b1d20; --panel: #262a2e; --line: #3a3f45; --ink: #eceef0; --soft: #a3a9b1; --acc: #3cc8dc;
          --hit: #164048; --empty: #202326; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 169px; width: 660px; overflow: hidden; background: var(--bg); color: var(--ink);
               font: 600 14px/1.2 "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif; user-select: none; }
  .top { display: flex; gap: 6px; align-items: center; height: 40px; padding: 6px 8px 4px; }
  button, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                   border-radius: 6px; height: 30px; }
  button { padding: 0 10px; cursor: pointer; }
  button:active { background: var(--hit); }
  #setbtn { flex: 1; min-width: 0; font-size: 18px; text-align: left; padding: 0 10px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; }
  #setbtn::after { content: " ▾"; color: var(--soft); }
  #picker { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 9; }
  #picker.open { display: flex; }
  #picker .bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  #picker .bar b { flex: 1; font-size: 16px; color: var(--soft); }
  #plist { flex: 1; overflow-y: auto; padding: 4px 8px 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
           align-content: start; }
  #plist h4 { grid-column: 1 / -1; margin: 6px 0 0; font-size: 13px; color: var(--acc); letter-spacing: .06em; }
  #plist button { height: 30px; font-size: 15px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #plist button.cur { background: var(--acc); color: #0c1214; border-color: var(--acc); }
  #oct { min-width: 26px; text-align: center; font-size: 17px; color: var(--acc); }
  #info.err { color: #ff6b6b; }
  #ed { background: var(--acc); color: #0c1214; border-color: var(--acc); font-weight: 700; letter-spacing: .04em; }
  .mid { display: flex; gap: 8px; height: 66px; padding: 0 8px; }
  .now { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  #chord { font-size: 38px; font-weight: 700; color: var(--acc); white-space: nowrap; overflow: hidden;
           text-overflow: ellipsis; line-height: 42px; }
  #info { color: var(--soft); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* how a key plays: the mode and latch, then the mode's own settings */
  .playc { width: 392px; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .playc .row { display: flex; gap: 3px; align-items: center; }
  .playc button { height: 28px; padding: 0 8px; font-size: 14px; white-space: nowrap; }
  .playc .seg button { min-width: 58px; }
  .playc button.on { background: var(--acc); border-color: var(--acc); color: #0c1214; }
  .playc .lbl { color: var(--soft); font-size: 12px; margin-left: 3px; }
  .playc .lbl:first-child { margin-left: 0; }
  .playc .val { min-width: 38px; text-align: center; font-size: 15px; color: var(--ink); }
  #more button { padding: 0 7px; }
  #beat { display: none; position: absolute; right: 8px; bottom: 0; font-size: 12px; color: #ff6b6b; }
  #beat.bad { display: block; }
  .keys { display: grid; grid-template-columns: repeat(27, 1fr); gap: 2px; height: 58px; padding: 2px 8px 8px; }
  .k { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; display: flex;
       align-items: flex-end; justify-content: center; padding-bottom: 4px; font-size: 11px; color: var(--soft);
       overflow: hidden; cursor: pointer; }
  .k.b { background: #15171a; margin-bottom: 14px; }
  .k.e { opacity: .35; }
  .k.on { background: var(--acc); border-color: var(--acc); color: #0c1214; }
</style>
</head>
<body>
<div class="top">
  <button id="prev" aria-label="Previous set">◀</button>
  <button id="setbtn" aria-label="Chord set">FM1-Chord</button>
  <button id="next" aria-label="Next set">▶</button>
  <button id="od" aria-label="Octave down">OCT −</button>
  <span id="oct">0</span>
  <button id="ou" aria-label="Octave up">OCT +</button>
  <button id="ed">EDITOR</button>
</div>
<div class="mid">
  <div class="now"><div id="chord">FM1-Chord</div><div id="info">Loading…</div></div>
  <div class="playc">
    <div class="row seg" id="modes">
      <button data-mode="0">CHORD</button><button data-mode="1">STRUM</button><button data-mode="2">ARP</button>
      <button id="latch">LATCH</button><button id="vl">VOICE LEAD</button>
    </div>
    <div class="row" id="more"></div>
  </div>
</div>
<div id="beat">device: not heard yet</div>
<div class="keys" id="keys"></div>
<div id="picker" role="dialog" aria-label="Choose a set">
  <div class="bar"><b>CHOOSE A SET</b><button id="pclose">CLOSE</button></div>
  <div id="plist"></div>
</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
// to the device: window.max.outlet; without it, Max's other way, a maxmessage: link
const say = (...a) => {
  if (window.max && typeof window.max.outlet === "function") { try { window.max.outlet(...a); return; } catch (e) {} }
  const l = document.createElement("a");
  l.href = "maxmessage:" + a.map((x) => encodeURIComponent(String(x))).join("/");
  document.body.append(l); l.click(); l.remove();
};
const NOTE = ["F", "F#", "G", "G#", "A", "A#", "B", "C", "C#", "D", "D#", "E"];
const isBlack = (k) => [1, 3, 5, 8, 10].includes(k % 12);
let state = { name: "", kind: "factory", i: 0, chords: [], mode: "" }, lit = new Set(), lastKey = -1;
let list = { factory: [], mine: [] }, waiting = null;
function ask(...a) {                                 // a request the device answers with "show": say if it doesn't
  say(...a);
  clearTimeout(waiting);
  $("#info").textContent = "Asking the device…";
  waiting = setTimeout(() => { $("#info").textContent = "No answer from the device: see the Max window"; }, 1500);
}

function keys() {
  const el = $("#keys");
  if (el.children.length !== 27) {
    el.innerHTML = "";
    for (let k = 0; k < 27; k++) {
      const d = document.createElement("div");
      d.className = "k" + (isBlack(k) ? " b" : "");
      d.dataset.k = k;
      d.onpointerdown = (e) => { d.setPointerCapture(e.pointerId); say("key", k, 100); };
      d.onpointerup = d.onpointercancel = () => say("key", k, 0);
      el.append(d);
    }
  }
  for (const d of el.children) {
    const k = +d.dataset.k, c = state.chords[k] || "";
    d.classList.toggle("on", lit.has(k));
    d.classList.toggle("e", !c);
    d.textContent = c.replace(/^([A-G][#b]?).*/, "$1");
    d.title = `Key ${k + 1}: ${c || "empty"}`;
  }
}
// how a key plays: the buttons show the set's settings; each press asks the device to change one
const RATES = ["1/4", "1/8", "1/8T", "1/16", "1/16T", "1/32"], SDIRS = ["UP", "DOWN", "ALT"], ADIRS = ["UP", "DOWN", "UP-DN", "RND"];
function playControls() {
  const p = state.play || {};
  document.querySelectorAll("#modes [data-mode]").forEach((b) => b.classList.toggle("on", +b.dataset.mode === (p.mode | 0)));
  $("#latch").classList.toggle("on", !!p.latch);
  $("#vl").classList.toggle("on", !!p.voice_lead);
  const m = $("#more");
  const cyc = (f, list, base = 0) => `<button data-cyc="${f}" data-n="${list.length}" data-base="${base}">${list[((p[f] | 0) - base + list.length) % list.length]}</button>`;
  const num = (f, txt, step) => `<button data-f="${f}" data-d="-${step}">−</button><span class="val">${txt}</span><button data-f="${f}" data-d="${step}">+</button>`;
  if ((p.mode | 0) === 1)
    m.innerHTML = `<span class="lbl">SPEED</span>${num("strum", ((p.strum | 0) * 2) + "ms", 5)}<span class="lbl">DIR</span>${cyc("strum_dir", SDIRS)}`;
  else if ((p.mode | 0) === 2)
    m.innerHTML = `<span class="lbl">RATE</span>${cyc("arp_rate", RATES)}<span class="lbl">DIR</span>${cyc("arp_dir", ADIRS)}` +
      `<span class="lbl">OCT</span>${cyc("arp_oct", ["1", "2", "3"], 1)}<span class="lbl">GATE</span>${num("arp_gate", (p.arp_gate | 0) + "%", 10)}`;
  else m.innerHTML = `<span class="lbl">HUMANISE</span>${num("humanise", String(p.humanise | 0), 8)}`;
  m.querySelectorAll("[data-cyc]").forEach((b) => (b.onclick = () => {
    const f = b.dataset.cyc, n = +b.dataset.n, base = +b.dataset.base;
    ask("play", f, base + (((p[f] | 0) - base + 1) % n));
  }));
  m.querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => ask("play", b.dataset.f, (p[b.dataset.f] | 0) + +b.dataset.d)));
}
document.querySelectorAll("#modes [data-mode]").forEach((b) => (b.onclick = () => ask("play", "mode", +b.dataset.mode)));
$("#latch").onclick = () => ask("play", "latch", (state.play && state.play.latch) ? 0 : 1);
$("#vl").onclick = () => ask("play", "voice_lead", (state.play && state.play.voice_lead) ? 0 : 1);
function chordLine() {
  const k = lit.size ? [...lit].pop() : lastKey;
  const c = k >= 0 ? state.chords[k] : "";
  $("#chord").textContent = c || "—";
  if ($("#info").className === "err") return;
  $("#info").textContent = k >= 0 ? `KEY ${k + 1} · ${NOTE[k % 12]}${3 + Math.floor((k + 5) / 12)}` : "Play a key from Key 1 up";
}
function options() {                               // the set button, and the list it opens (drawn by the page:
  const btn = $("#setbtn");                         // a web view inside Live can't open a native drop-down)
  btn.textContent = state.name || "FM1-Chord";
  const pl = $("#plist");
  pl.innerHTML = "";
  const grp = (label, names, kind) => {
    if (!names.length) return;
    const h = document.createElement("h4");
    h.textContent = label;
    pl.append(h);
    names.forEach((n, i) => {
      const b = document.createElement("button");
      b.textContent = n;
      b.dataset.v = kind + ":" + i;
      if (kind === state.kind && i === state.i) b.className = "cur";
      b.onclick = () => { $("#picker").classList.remove("open"); ask("choose", kind, i); };
      pl.append(b);
    });
  };
  grp("MY SETS", list.mine, "mine");
  grp("FACTORY", list.factory, "factory");
}
let beatAt = 0;
const started = Date.now();
setInterval(() => {                                   // the device's heartbeat stopped?
  if (Date.now() - (beatAt || started) > 3000) { $("#beat").className = "bad"; $("#beat").textContent = "device: silent"; }
}, 1000);
window.__fcIn = (name, data) => {
  if (name === "beat") {
    beatAt = Date.now();
    $("#beat").className = "";
    return;
  }
  if (name === "error") { clearTimeout(waiting); const i = $("#info"); i.textContent = data; i.className = "err"; return; }
  if (name === "list") { list = data; options(); }
  else if (name === "show") {
    clearTimeout(waiting); $("#info").className = "";
    $("#oct").textContent = (data.oct > 0 ? "+" : "") + (data.oct | 0);
    state = data; lastKey = -1; options(); keys(); chordLine(); playControls(); }
  else if (name === "lit") {
    const [k, on] = data;
    if (on) { lit.add(k); lastKey = k; } else lit.delete(k);
    keys(); chordLine();
  }
};
$("#setbtn").onclick = () => {
  $("#picker").classList.add("open");
  const c = document.querySelector("#plist .cur");
  if (c) c.scrollIntoView({ block: "center" });
};
$("#pclose").onclick = () => $("#picker").classList.remove("open");
$("#prev").onclick = () => ask("step", -1);
$("#next").onclick = () => ask("step", 1);
$("#ed").onclick = () => say("openeditor");
$("#od").onclick = () => ask("octstep", -1);
$("#ou").onclick = () => ask("octstep", 1);
keys(); chordLine();
say("stripready");
</script>
</body>
</html>
